<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Code Block with Input</title>
    <style>
        .wrapper {
            max-width: 600px;
            margin: 20px auto;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #24292f;
        }
        .text-input {
            width: 100%;
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .text-input:focus {
            outline: none;
            border-color: #0969da;
            box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.3);
        }
        .code-container {
            position: relative;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 16px;
            font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
        }
        pre {
            margin: 0;
            overflow-x: auto;
        }
        code {
            color: #c9d1d9;
            white-space: pre;
        }
        /* Highlight the dynamic user input within the code */
        .dynamic-placeholder {
            color: #ff7b72; 
            font-weight: bold;
        }
        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 4px;
            padding: 5px 10px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .copy-btn:hover {
            background-color: #30363d;
            border-color: #8b949e;
        }
        .copy-btn.copied {
            background-color: #238636;
            color: white;
            border-color: #2ea44f;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <!-- Input Field -->
    <div class="input-group">
        <label for="userNameInput">Enter your name:</label>
        <input type="text" id="userNameInput" class="text-input" placeholder="World" oninput="updateCode()">
    </div>

    <!-- Code Block Container -->
    <div class="code-container">
        <button class="copy-btn" onclick="copyCode(this)">Copy</button>
        <pre><code id="codeBlock">const express = require('express')
const app = express()

app.get('/', (req, res) => {
  res.send('Hello <span id="codeOutput" class="dynamic-placeholder">World</span>!')
})</code></pre>
    </div>
</div>

<script>
function updateCode() {
    // Get the value from the user input field
    const inputValue = document.getElementById("userNameInput").value;
    const outputSpan = document.getElementById("codeOutput");

    // Update the text within the code block. Fallback to "World" if empty.
    if (inputValue.trim() === "") {
        outputSpan.innerText = "World";
    } else {
        outputSpan.innerText = inputValue;
    }
}

function copyCode(button) {
    // innerText reads the clean textual layout of the code container (ignoring the span tags)
    const codeText = document.getElementById("codeBlock").innerText;

    navigator.clipboard.writeText(codeText).then(() => {
        button.innerText = "Copied!";
        button.classList.add("copied");

        setTimeout(() => {
            button.innerText = "Copy";
            button.classList.remove("copied");
        }, 2000);
    }).catch(err => {
        console.error("Failed to copy text: ", err);
    });
}
</script>

</body>
</html>
